[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "vapor-game"
version = "0.22.0"
requires-python = ">=3.10"
description = "Python C-ABI binding for the Rust Vapor game runtime (native library built separately)"
[tool.setuptools]
packages = ["vapor_game"]
[tool.setuptools.package-data]
vapor_game = ["presets.json"]
