name: Pages example checks
on:
  pull_request:
    paths: ['site/**','examples/**','bindings/web/**','contracts/**','tools/build_pages.py','tools/validate_interactive_cloud.py','tests/test_pages.py','tests/interactive-cloud.test.mjs','tests/terrain-fog.test.mjs','tests/cloud-mesh.test.mjs','.github/workflows/pages-check.yml','.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  interactive-cloud:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p test_pages.py
      - run: node --test tests/interactive-cloud.test.mjs tests/terrain-fog.test.mjs tests/cloud-mesh.test.mjs
      - run: python tools/build_pages.py --assets none
      - run: python -m pip install playwright
      - run: python -m playwright install --with-deps chromium
      - run: python tools/validate_interactive_cloud.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: interactive-cloud-browser
          path: reports/local/interactive-cloud/
