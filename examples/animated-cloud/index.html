<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vapor | Animated field</title><style>body{margin:0;color:#dce6f2;background:#121923;font:14px system-ui}main{max-width:1050px;margin:20px auto;padding:20px}h1{font-size:24px}button,input,select{font:inherit;color:inherit;background:#222e3e;border:1px solid #465568;border-radius:6px;padding:8px}label{display:block;color:#9fadc1}input[type=text]{width:min(550px,85vw)}canvas{display:block;width:100%;margin:14px 0;border:1px solid #465568;background:#0b111b}input[type=range]{width:100%;padding:0}#status{white-space:pre-wrap;color:#b0bfd0}p{color:#9fadc1;line-height:1.5}</style><main><h1>Vapor / Animated volume</h1><p>VPA1 streaming · explicitly baked Float32 field · no Rust/GPU simulation fallback. WebGPU uses the existing high-fidelity optics, not pre-rendered images.</p><label for="url">Sequence index URL (same-origin)</label><input id="url" type="text" value="../../assets/cloud-motion/sequence.vpa"><button id="open">Open</button><canvas id="canvas" width="768" height="480"></canvas><input id="time" type="range" min="0" max="12" step="0.01" disabled><div><button id="play" disabled>Play</button> <button id="pause" disabled>Pause</button> <label style="display:inline">Upload Hz <select id="hz"><option>2</option><option>4</option><option>8</option></select></label></div><p id="status">Extract the animation asset package into the project root, then open the sequence.</p></main><script type="module" src="main.mjs"></script></html>
